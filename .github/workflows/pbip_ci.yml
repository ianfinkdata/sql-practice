name: PBIP TMDL Validation & Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-pbip-and-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f project/requirements.txt ]; then pip install -r project/requirements.txt; fi

      - name: Build / Verify Medallion Database
        run: |
          python project/build.py

      - name: Run PBIP TMDL Linter & Path Sanitizer
        run: |
          python pbip_poc/tools/pbip_linter.py --fix

      - name: Verify End-to-End Pipeline Lineage
        run: |
          python pbip_poc/tools/pipeline_lineage.py

      - name: Check for Uncommitted Path Sanitization Changes
        run: |
          git diff --exit-code || (echo "⚠️ TMDL files contain un-sanitized paths! Run pbip_linter.py --fix locally." && exit 1)
