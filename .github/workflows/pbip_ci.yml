name: PBIP TMDL Validation & Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-pbip-and-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f project/requirements.txt ]; then pip install -r project/requirements.txt; fi

      - name: Build & Verify Medallion Database
        run: |
          python project/build.py

      - name: Run PBIP TMDL Linter (Path Dependencies & Syntax Check)
        run: |
          python pbip/pyscripts/pbip_linter.py

      - name: Verify End-to-End Pipeline Lineage
        run: |
          python pbip/pyscripts/pipeline_lineage.py

      - name: Test TMDL AST Parser & Schema DDL Compiler
        run: |
          python pbip/pyscripts/parse_tmdl.py --test-db

      - name: Test TMDL to SQL View Pushdown Compiler
        run: |
          python pbip/pyscripts/pbip_to_db.py --test-db
